# Bộ từ khoá của luật phân loại (F-013, thiết kế bộ luật 2026-11-28). Sửa tay được, không cần sửa code.
#
# - Mỗi nhóm có `strong` (một từ là đủ: 2 điểm) và `weak` (1 điểm mỗi từ; nhóm cần đủ 2 điểm).
# - Từ khoá viết chữ thường. So theo NGUYÊN TỪ trên topic, tên repo và mô tả: `agent` không khớp `agents`;
#   `text-to-video` khớp cả "text to video". Từ khoá chữ Hán khớp theo chuỗi con.
# - `[derived]`: nhóm "Dành cho ai" được cộng điểm khi repo đã thuộc một trong các nhóm "Làm được gì" bên phải.
# - Danh sách ban đầu chọn từ số đo trên ~40.000 nhãn AI (28/11/2026): từ mạnh là từ mà ≥ ~80% repo chứa nó được AI
#   xếp vào nhóm. Thêm trào lưu mới thì thêm từ vào đây.
# - Mỗi lần sửa file thì TĂNG `version`, rồi chạy `uv run python manage.py classify --compare-rules` để đo lại.

version = 1

[derived]
developer = ["devtools", "ai_infra", "webapp", "scraping"]
creator = ["video", "image", "audio"]
marketer = ["ads", "social"]
business = ["commerce"]
gamedev = ["game"]

